seed: 88
dataset: citeseer
sample_size: 30
smoke_size: 12
selection_strategy: stratified_low_margin
victim_batch_size: 8
embedding_batch_size: 32
candidate_count: 6
generation_attempts: 6
query_budget: 6
feedback_initial_queries: 3
feedback_refinement_queries: 3
max_new_tokens: 256
node_max_length: 256
min_parsing_rate: 0.50
min_valid_record_rate: 0.50
temperature: 0.70
max_length_ratio: 1.20
min_length_ratio: 0.80
max_changed_token_ratio: 0.20
min_semantic_similarity: 0.85
generator_model: Qwen/Qwen2.5-0.5B-Instruct
node_encoder_model: sentence-transformers/all-MiniLM-L6-v2
semantic_model: sentence-transformers/all-mpnet-base-v2
methods:
  - random_edit
  - non_graph_attack
  - graph_prompt_attack
feedback_methods:
  - feedback_non_graph
  - graph_feedback
